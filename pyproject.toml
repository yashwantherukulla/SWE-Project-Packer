[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-code-packer"
version = "0.1.0"
description = "Benign triggered memorization demo using Hydra and Hugging Face Transformers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "torch>=2.1.0",
  "transformers>=4.44.0",
  "tensorboard>=2.16.0",
  "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
wandb = [
  "wandb>=0.17.0",
]

[project.scripts]
run-pipeline = "scripts.run_pipeline:main"

[tool.setuptools]
packages = ["src", "src.data", "src.models", "src.training", "src.inference", "src.eval", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
